# Dish catalogue used by the data inventory.
#
# Each dish lists where to look for openly licensed images:
#   commons_categories  Wikimedia Commons categories (without the "Category:" prefix).
#                       Several candidates may be listed; missing ones are reported
#                       by the inventory and simply skipped.
#   commons_exclude     Sub-categories to skip when walking the categories above.
#   openverse_queries   Openverse search strings. Each query costs one API call in
#                       the inventory; the dish count is the largest single result.
#
# The same list (with nutrition data) will become nutrition/dishes.json in step 2.
# Names, spellings and country tags need a review by someone who knows the dishes.

thresholds:
  model: 150     # usable photos needed to train the dish into the classifier (brief)
  few_shot: 20   # below this, even a nearest-neighbour approach is not worth testing

