      - {code: "07_011", g: 60}           # beef, lean, grilled
      - {code: "04_018", g: 15}           # onion
      - {code: "04_124", g: 5}            # tomato, boiled
      - {code: "04_046", g: 3}            # chilli pepper
      - {code: "11_010", g: [5, 10]}      # oil or ghee
