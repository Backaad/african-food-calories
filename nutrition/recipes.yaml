  - id: suya
    portions: {small: 80, medium: 150, large: 250}
    ingredients:
      - {code: "07_011", g: 85}           # beef, lean, grilled
      - {code: "06_026", g: [5, 8], note: "suya spice (kuli kuli) approximated by groundnut paste"}
      - {code: "11_010", g: [2, 5]}       # oil brushed on
      - {code: "13_006", g: 2}            # dried chilli
      - {code: "04_018", g: 3}            # onion

  - id: akara
    portions: {small: 50, medium: 100, large: 150}
    ingredients:
      - {code: "03_101", g: 72, note: "soaked ground cowpea approximated by dehulled cowpea, boiled"}
      - {code: "04_018", g: 5}            # onion
      - {code: "04_046", g: 2}            # chilli pepper
      - {code: "11_010", g: [15, 25]}     # oil absorbed in frying
      - {code: "13_015", g: 1}            # salt

  - id: pepper_soup
    portions: {small: 200, medium: 300, large: 450}
    ingredients:
      - {code: "07_112", g: 25}           # goat meat, stewed
      - {code: "04_018", g: 2}            # onion
      - {code: "04_046", g: 1}            # chilli pepper
      - {code: "11_010", g: [0, 2]}       # oil, often none
      - {code: water, g: 71}

  # ---------------------------------------------------------------- Côte d'Ivoire, Senegal
  - id: attieke
    portions: {small: 150, medium: 250, large: 350}
    ingredients:
      - {code: "02_041", g: 96, proxy: true, note: "attiéké (steamed fermented cassava granules) is not in WAFCT 2019; wet fermented cassava paste used instead"}
      - {code: "11_010", g: [0, 4]}       # oil sometimes mixed in

  - id: alloco
    portions: {small: 100, medium: 150, large: 250}
    ingredients:
      - {code: "02_084", g: 98}           # plantain, deep fried
      - {code: "11_010", g: [0, 4], note: "extra oil absorbed, beyond the WAFCT fried plantain"}

  - id: thieboudienne
    portions: {small: 250, medium: 350, large: 500}
    ingredients:
      - {code: "01_135", g: 55}           # rice, white, boiled
      - {code: "09_046", g: 12}           # white grouper, steamed
      - {code: "04_090", g: 5}            # cabbage, boiled
      - {code: "04_102", g: 4}            # eggplant, boiled
      - {code: "02_051", g: 4}            # cassava, boiled
      - {code: "04_066", g: 2}            # tomato paste
      - {code: "04_018", g: 3}            # onion
      - {code: "11_010", g: [6, 12]}      # vegetable oil
      - {code: water, g: 6}

  - id: yassa
    portions: {small: 150, medium: 250, large: 350}
    notes: Chicken and onion sauce, without rice.
    ingredients:
      - {code: "07_103", g: 35}           # chicken, dark meat with skin, stewed
      - {code: "04_112", g: 45}           # onion, boiled
      - {code: "12_010", g: 3}            # lemon juice
      - {code: "11_010", g: [6, 12]}      # vegetable oil
      - {code: water, g: 8}

  - id: mafe
    portions: {small: 150, medium: 250, large: 350}
    notes: Peanut stew without rice.
    ingredients:
      - {code: "07_086", g: 15}           # beef, moderately fat, stewed
      - {code: "06_026", g: [10, 14]}     # groundnut paste
      - {code: "04_066", g: 3}            # tomato paste
      - {code: "04_018", g: 3}            # onion
      - {code: "02_068", g: 10}           # potato, boiled
      - {code: "04_090", g: 5}            # cabbage, boiled
      - {code: "11_010", g: [2, 6]}       # vegetable oil
      - {code: water, g: 48}

  # ---------------------------------------------------------------- East Africa
  - id: ugali
    portions: {small: 200, medium: 300, large: 450}
    ingredients:
      - {code: "01_080", g: [30, 38]}     # white maize meal, sifted
      - {code: water, g: 66}

